<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Force Browsers/Phones to Fetch Fresh Content on Update -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>David H. Marie-Jeanne — Registered Architect 331</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #050505;
      --surface: #111111;
      --surface-hover: #1a1a1a;
      --text: #ffffff;
      --text-muted: #b0b0b0;
      --text-dim: #777777;
      --accent: #c5b395; /* Elegant architectural warm bronze/gold */
      --border: rgba(255, 255, 255, 0.12);
      --border-hover: rgba(197, 179, 149, 0.5);
    }

    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--black);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* ════════════════════════════════════════
       HERO & TOP SECTION (FITS MOBILE SCREEN PERFECTLY)
       ════════════════════════════════════════ */
    .hero-section {
      min-height: 100vh;
      min-height: 100dvh; /* Dynamic viewport unit for mobile browsers */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 1rem 1rem 1rem;
      position: relative;
    }

    .hero-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      align-items: center;
      text-align: center;
    }

    /* 1. Refined Brand Slogan */
    .brand-slogan {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-style: italic;
      color: var(--accent);
      letter-spacing: 1px;
      line-height: 1.4;
      max-width: 380px;
    }

    /* 2. Architectural Brand Identity */
    .brand-identity {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .brand-identity h1 {
      font-size: 1.75rem;
      font-weight: 300;
      letter-spacing: 5px;
      line-height: 1;
      text-transform: uppercase;
      color: var(--text);
    }
    .brand-identity .reg-badge {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 3px;
      color: var(--text-muted);
    }

    /* 3. Luxury Unified Action Buttons */
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
    }

    .btn-architectural {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-architectural:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .btn-architectural.whatsapp {
      border-color: rgba(197, 179, 149, 0.3);
      background: linear-gradient(to bottom, #141414, #0d0d0d);
    }
    .btn-architectural.whatsapp:hover {
      border-color: var(--accent);
    }

    .btn-icon { font-size: 0.9rem; }

    /* 4. Featured Video Player */
    .video-section-wrapper {
      width: 100%;
      max-width: 440px;
      margin: 0.5rem 0;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 1400 / 1080;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Scroll Indicator */
    .scroll-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-dim);
      font-size: 0.6rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.2s;
      padding-top: 0.5rem;
    }
    .scroll-hint:hover { color: var(--text); }
    .scroll-arrow { font-size: 0.85rem; animation: bounce 2s infinite; }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(5px); }
      60% { transform: translateY(2px); }
    }

    /* ════════════════════════════════════════
       CV SECTIONS
       ════════════════════════════════════════ */
    .section {
      max-width: 960px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Services */
    .services-section {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .services-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }
    .service-card {
      padding: 1.5rem;
      border: 1px solid var(--border);
      background: var(--black);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 1rem;
      border-radius: 4px;
    }
    .service-card:hover {
      border-color: var(--accent);
      background: var(--surface-hover);
      transform: translateY(-2px);
    }
    .service-icon { font-size: 1.1rem; color: var(--accent); flex-shrink: 0; width: 1.5rem; text-align: center; }
    .service-name { font-size: 0.9rem; font-weight: 500; color: var(--text); line-height: 1.4; }

    /* Profile text */
    .profile-text {
      font-size: 1.05rem;
      line-height: 1.85;
      color: var(--text-muted);
      max-width: 720px;
      font-weight: 300;
