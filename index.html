<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David H. Marie-Jeanne | Architect 331</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card-container {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1.58 / 1; /* Standard Business Card Aspect Ratio */
      border: 1.5px solid #ffffff;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background-color: #000000;
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.05);
    }
    /* Top Left Header */
    .header {
      text-align: left;
    }
    .header h1 {
      font-size: 1.7rem;
      font-weight: 300;
      letter-spacing: 3px;
      line-height: 1.1;
      text-transform: uppercase;
    }
    .header .reg {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }
    /* Bottom Right Info */
    .footer-info {
      text-align: right;
      align-self: flex-end;
      margin-bottom: 20px;
    }
    .vcard-link {
      display: inline-block;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
      transition: opacity 0.2s ease;
    }
    .vcard-link:hover {
      opacity: 0.7;
    }
    .contact-line {
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 1px;
      color: #e0e0e0;
      margin-top: 3px;
    }
    .contact-line a {
      color: #ffffff;
      text-decoration: none;
    }
    .contact-line a:hover {
      text-decoration: underline;
    }
    /* Architectural Ruler Graphics at Bottom */
    .ruler {
      position: absolute;
      bottom: 8px;
      left: 16px;
      right: 16px;
      height: 18px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .tick {
      width: 1px;
      background-color: #ffffff;
    }
    .tick.major {
      height: 16px;
    }
    .tick.medium {
      height: 10px;
    }
    .tick.minor {
      height: 5px;
    }
    .ruler-base {
      position: absolute;
      bottom: 8px;
      left: 16px;
      right: 16px;
      height: 1px;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- Top Left -->
    <div class="header">
      <h1>ARCHITECT</h1>
      <div class="reg">331</div>
    </div>

    <!-- Bottom Right -->
    <div class="footer-info">
      <!-- Tapping your name triggers the .vcf contact download -->
      <a href="contact.vcf" class="vcard-link" title="Save Contact Card">DAVID H. MARIE-JEANNE</a>
      <div class="contact-line"><a href="tel:+23054293170">+230 5429 3170</a></div>
      <div class="contact-line"><a href="mailto:davidhmj@gmail.com">davidhmj@gmail.com</a></div>
    </div>

    <!-- Architectural Scale Ruler -->
    <div class="ruler-base"></div>
    <div class="ruler">
      <div class="tick major"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick medium"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick major"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick medium"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick major"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick medium"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick major"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick medium"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick major"></div>
    </div>

  </div>

</body>
</html>
