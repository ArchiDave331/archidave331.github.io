<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David H. Marie-Jeanne | Architect 331</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card-container {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1.58 / 1; /* Standard Business Card Aspect Ratio */
      border: 1.5px solid #ffffff;
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background-color: #000000;
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.05);
    }
    /* Top Left Header */
    .header {
      text-align: left;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 3px;
      line-height: 1.1;
      text-transform: uppercase;
    }
    .header .reg {
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    /* Middle / Interactive Status */
    .status-tag {
      font-size: 0.62rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #888888;
      margin-top: 6px;
    }

    /* Bottom Right Info */
    .footer-info {
      text-align: right;
      align-self: flex-end;
      margin-bottom: 18px;
    }
    .name {
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .contact-line {
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 1px;
      color: #cccccc;
      margin-top: 2px;
    }
    .contact-line a {
      color: #ffffff;
      text-decoration: none;
    }

    /* Main CTA: Add to Contacts Button */
    .btn-vcard {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 12px;
      border: 1px solid #ffffff;
      border-radius: 4px;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    .btn-vcard:hover {
      background: #000000;
      color: #ffffff;
    }

    /* Architectural Scale Ruler Graphics */
    .ruler {
      position: absolute;
      bottom: 6px;
      left: 16px;
      right: 16px;
      height: 16px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .tick {
      width: 1px;
      background-color: #ffffff;
    }
    .tick.major { height: 14px; }
    .tick.medium { height: 9px; }
    .tick.minor { height: 4px; }
    .ruler-base {
      position: absolute;
      bottom: 6px;
      left: 16px;
      right: 16px;
      height: 1px;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- Top Left -->
    <div class="header">
      <h1>ARCHITECT</h1>
      <div class="reg">331</div>
      <div class="status-tag">🌐 Interactive 3D Model Launching Soon</div>
    </div>

    <!-- Bottom Right -->
    <div class="footer-info">
      <div class="name">DAVID H. MARIE-JEANNE</div>
      <div class="contact-line"><a href="tel:+23054293170">+230 5429 3170</a></div>
      <div class="contact-line"><a href="mailto:davidhmj@gmail.com">davidhmj@gmail.com</a></div>
      
      <!-- Primary Action -->
      <a href="contact.vcf" class="btn-vcard">+ Add to Contacts</a>
    </div>

    <!-- Architectural Scale Ruler -->
    <div class="ruler-base"></div>
    <div class="ruler">
      <div class="tick major"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick medium"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick major"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick medium"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick major"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick medium"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick major"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick medium"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick minor"></div>
      <div class="tick major"></div>
    </div>

  </div>

</body>
</html>
