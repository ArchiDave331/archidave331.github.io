<!-- UNIVERSAL PLAYBACK SCRIPT (COMPATIBLE WITH FACEBOOK & IN-APP BROWSERS) -->
  <script>
    // Hero Video Control
    const mainVideo = document.getElementById('main-video');
    const mainPlayBtn = document.getElementById('main-play-btn');

    function playMainVideo() {
      // Unmute and display native controls synchronously to preserve gesture token
      mainVideo.muted = false;
      mainVideo.controls = true;
      mainPlayBtn.style.display = 'none';

      var playPromise = mainVideo.play();
      if (playPromise !== undefined) {
        playPromise.then(function() {
          if (window.goatcounter) {
            window.goatcounter.count({
              path: 'video-play-hero',
              title: 'Video Play: Hero Video',
              event: true
            });
          }
        }).catch(function(error) {
          // Fallback if blocked: keep controls visible so user can tap standard play bar
          mainVideo.controls = true;
        });
      }
    }

    mainPlayBtn.addEventListener('click', playMainVideo);
    mainVideo.addEventListener('click', playMainVideo);

    mainVideo.addEventListener('play', function() {
      mainPlayBtn.style.display = 'none';
      mainVideo.controls = true;
    });

    // Archive Video Controls
    document.querySelectorAll('.archive-play-btn').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        var targetId = e.target.getAttribute('data-target');
        var archiveVideo = document.getElementById(targetId);
        
        archiveVideo.muted = false;
        archiveVideo.controls = true;
        e.target.style.display = 'none';

        var playPromise = archiveVideo.play();
        if (playPromise !== undefined) {
          playPromise.then(function() {
            if (window.goatcounter) {
              window.goatcounter.count({
                path: 'video-play-' + targetId,
                title: 'Video Play: ' + targetId,
                event: true
              });
            }
          }).catch(function(err) {
            archiveVideo.controls = true;
          });
        }
      });
    });

    document.querySelectorAll('.archive-video-thumb').forEach(function(vid) {
      vid.addEventListener('click', function() {
        if (vid.paused) {
          vid.muted = false;
          vid.controls = true;
          var btn = vid.parentElement.querySelector('.archive-play-btn');
          if (btn) btn.style.display = 'none';
          vid.play();
        }
      });
    });
  </script>
