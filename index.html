<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David H. Marie-Jeanne | Architect</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0f12;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #161920;
      padding: 36px 28px;
      border-radius: 16px;
      border: 1px solid #282c37;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      max-width: 360px;
      width: 100%;
    }
    h1 { 
      font-size: 1.35rem; 
      letter-spacing: 0.5px;
      margin-bottom: 6px; 
      font-weight: 600;
    }
    p.title { 
      color: #0088ff; 
      margin-top: 0; 
      font-size: 0.85rem; 
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    p.reg {
      color: #7b8596;
      font-size: 0.8rem;
      margin-top: -8px;
      margin-bottom: 24px;
    }
    .contact-info {
      text-align: left;
      background: #0f1116;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 24px;
      font-size: 0.85rem;
      border: 1px solid #1f232e;
    }
    .contact-info div {
      margin-bottom: 8px;
      color: #c5cbd3;
    }
    .contact-info div:last-child {
      margin-bottom: 0;
    }
    .contact-info a {
      color: #ffffff;
      text-decoration: none;
    }
    .btn {
      display: block;
      background-color: #0066ff;
      color: #fff;
      padding: 14px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background-color: #0052cc;
    }
    .badge {
      display: inline-block;
      background: #1c251e;
      color: #00d084;
      border: 1px solid #234731;
      font-size: 0.72rem;
      padding: 6px 14px;
      border-radius: 20px;
      margin-top: 24px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>David H. Marie-Jeanne</h1>
    <p class="title">Architect</p>
    <p class="reg">Reg. 331</p>

    <div class="contact-info">
      <div>📱 <a href="tel:+23054293170">+230 5429 3170</a></div>
      <div>✉️ <a href="mailto:davidhmj@gmail.com">davidhmj@gmail.com</a></div>
    </div>
    
    <a href="contact.vcf" class="btn">Add to Contacts</a>

    <span class="badge">🌐 Interactive 3D Model Launching Soon</span>
  </div>

</body>
</html>
