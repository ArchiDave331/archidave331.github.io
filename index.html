    html { scroll-behavior: smooth; font-size: 16px; }

    body {

      background: var(--black);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .hero-section {
      min-height: 100vh;

      padding: 1.5rem 1rem 1rem 1rem;
      position: relative;
    }

    .hero-container {

      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      align-items: center;
      text-align: center;
    }

    .brand-slogan {
      font-family: 'Playfair Display', serif;

      font-style: italic;
      color: var(--accent);
      letter-spacing: 1px;
      line-height: 1.4;
      max-width: 380px;
    }

    .brand-identity {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .brand-identity h1 {
      font-size: 1.75rem;
      font-weight: 300;
      letter-spacing: 5px;
      line-height: 1;
      text-transform: uppercase;
      color: var(--text);
    }
    .brand-identity .reg-badge {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 3px;
      color: var(--text-muted);
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
    }

    .btn-architectural {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);

      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
