name: Auto-update videos list

on:
  push:
    branches:
      - main
    paths:
      - 'video*.mp4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update masterVideos in HTML file
        run: |
          python3 - << 'EOF'
          import glob
          import json
          import os
          import re

          # Find video1.mp4, video2.mp4, video3.mp4... in the same folder
          def video_sort_key(path):
              name = os.path.basename(path)
              match = re.search(r'(\d+)', name)
              return (int(match.group(1)) if match else 999999, name)

          files = sorted(glob.glob('video*.mp4'), key=video_sort_key)
          if not files:
              raise SystemExit("No video*.mp4 files found.")

          default_titles = {
              "video1.mp4": "The Vision of Architecture",
              "video2.mp4": "Designing for Better Living",
              "video3.mp4": "The Experience of Interior Spaces",
              "video4.mp4": "Land Development & Feasibility",
          }

          videos = []
          for f in files:
              filename = os.path.basename(f)
              stem = os.path.splitext(filename)[0]
              fallback_title = re.sub(r'([a-zA-Z]+)(\d+)', r'\1 \2', stem).replace('-', ' ').replace('_', ' ').title()
              title = default_titles.get(filename, fallback_title)
              videos.append({"src": filename, "title": title})

          html_path = "Propto.html" if os.path.exists("Propto.html") else "index.html"
          with open(html_path, "r", encoding="utf-8") as fh:
              content = fh.read()

          lines = ["      const masterVideos = ["]
          for i, v in enumerate(videos):
              comma = "," if i < len(videos) - 1 else ""
              lines.append(f"        {{ src: {json.dumps(v['src'])}, title: {json.dumps(v['title'])} }}{comma}")
          lines.append("      ];")
          replacement = "\n".join(lines)

          new_content, count = re.subn(
              r"      const masterVideos = \[[\s\S]*?\n      \];",
              replacement,
              content,
              count=1
          )
          if count == 0:
              raise SystemExit("Could not find masterVideos array in HTML.")

          with open(html_path, "w", encoding="utf-8") as fh:
              fh.write(new_content)
          EOF

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Auto-update masterVideos list"
            git push
          fi
