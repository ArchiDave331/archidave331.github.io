name: Auto-update videos list

on:
  push:
    branches:
      - main
    paths:
      - '*.mp4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update masterVideos in HTML file
        run: |
          python3 - << 'EOF'
          import glob
          import json
          import os
          import re

          files = sorted(glob.glob('*.mp4'))
          if not files:
              raise SystemExit("No .mp4 files found.")

          custom_titles = {
              # Optional: add exact overrides here if needed, e.g.:
              # "The Vision of Architecture.mp4": "The Vision of Architecture",
          }

          videos = []
          for f in files:
              filename = os.path.basename(f)
              stem = os.path.splitext(filename)[0]
              fallback_title = re.sub(r'\s+', ' ', stem.replace('-', ' ').replace('_', ' ')).strip().title()
              title = custom_titles.get(filename, fallback_title)
              videos.append({"src": filename, "title": title})

          html_path = "Propto.html" if os.path.exists("Propto.html") else "index.html"
          with open(html_path, "r", encoding="utf-8") as fh:
              content = fh.read()

          lines = ["      const masterVideos = ["]
          for i, v in enumerate(videos):
              comma = "," if i < len(videos) - 1 else ""
              lines.append(f"        {{ src: {json.dumps(v['src'])}, title: {json.dumps(v['title'])} }}{comma}")
          lines.append("      ];")
          replacement = "\n".join(lines)

          new_content, count = re.subn(
              r"      const masterVideos = \[[\s\S]*?\n      \];",
              replacement,
              content,
              count=1
          )
          if count == 0:
              raise SystemExit("Could not find masterVideos array in HTML.")

          with open(html_path, "w", encoding="utf-8") as fh:
              fh.write(new_content)
          EOF

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Auto-update masterVideos list"
            git push
          fi
