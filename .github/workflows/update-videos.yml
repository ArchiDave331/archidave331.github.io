      - name: Update masterVideos in HTML file
        run: |
          python3 - << 'EOF'
          import glob
          import json
          import os
          import re

          files = sorted(glob.glob('*.mp4'))
          if not files:
              print("No .mp4 files found in root folder; leaving masterVideos unchanged.")
              raise SystemExit(0)

          custom_titles = {
              # "From Land to Vision.mp4": "From Land to Vision",
          }

          videos = []
          for filename in files:
              stem = os.path.splitext(os.path.basename(filename))[0]
              title = custom_titles.get(filename, re.sub(r'\s+', ' ', stem).strip())
              videos.append({"src": filename, "title": title})

          html_path = "Propto.html" if os.path.exists("Propto.html") else "index.html"

          with open(html_path, "r", encoding="utf-8") as fh:
              content = fh.read()

          lines = ["      const masterVideos = ["]
          for i, video in enumerate(videos):
              comma = "," if i < len(videos) - 1 else ""
              lines.append(
                  f"        {{ src: {json.dumps(video['src'])}, "
                  f"title: {json.dumps(video['title'])} }}{comma}"
              )
          lines.append("      ];")
          replacement = "\n".join(lines)

          new_content, count = re.subn(
              r"[ \t]*const masterVideos = \[[\s\S]*?\n[ \t]*\];",
              replacement,
              content,
              count=1
          )

          if count == 0:
              raise SystemExit("Could not find masterVideos array in HTML.")

          with open(html_path, "w", encoding="utf-8") as fh:
              fh.write(new_content)

          print(f"Updated {html_path} with {len(videos)} video(s).")
          EOF
