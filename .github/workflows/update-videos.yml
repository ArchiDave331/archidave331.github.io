name: Auto-update videos list

on:
  push:
    branches:
      - main
    paths:
      - '*.mp4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make videos web-safe (H.264 + faststart)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          shopt -s nullglob
          for f in *.mp4; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 2000 ] && grep -q "git-lfs" "$f"; then
              echo "::error::$f is a Git LFS pointer, not a real video"
              continue
            fi
            v=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$f" </dev/null)
            p=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$f" </dev/null)
            a=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$f" </dev/null)
            if [ "$v" = "h264" ] && [ "$p" = "yuv420p" ] && { [ -z "$a" ] || [ "$a" = "aac" ]; }; then
              first=$(ffprobe -v trace -i "$f" </dev/null 2>&1 | grep -m1 -oE "type:'(moov|mdat)'" || true)
              if [ "$first" = "type:'mdat'" ]; then
                echo "Adding faststart: $f"
                ffmpeg -nostdin -y -v error -i "$f" -c copy -movflags +faststart "tmp_fix.mp4" && mv "tmp_fix.mp4" "$f"
              else
                echo "OK, no change needed: $f"
              fi
            else
              echo "Re-encoding: $f (video=$v pix=$p audio=$a)"
              ffmpeg -nostdin -y -v error -i "$f" -c:v libx264 -profile:v high -pix_fmt yuv420p -crf 23 -preset medium -c:a aac -b:a 128k -movflags +faststart "tmp_fix.mp4" && mv "tmp_fix.mp4" "$f"
            fi
          done

      - name: Update masterVideos in HTML file
        run: |
          python3 - << 'EOF'
          import glob
          import json
          import os
          import re

          files = sorted(glob.glob('*.mp4'))
          if not files:
              print("No .mp4 files found; nothing to update.")
              raise SystemExit(0)

          custom_titles = {}

          videos = []
          for filename in files:
              stem = os.path.splitext(os.path.basename(filename))[0]
              cleaned = re.sub(r'\s+', ' ', stem.replace('-', ' ').replace('_', ' ')).strip()
              title = custom_titles.get(filename, cleaned)
              videos.append({"src": filename, "title": title})

          html_path = "Propto.html" if os.path.exists("Propto.html") else "index.html"
          with open(html_path, "r", encoding="utf-8") as fh:
              content = fh.read()

          start_marker = "const masterVideos = ["
          start_idx = content.find(start_marker)
          if start_idx == -1:
              raise SystemExit("Could not find 'const masterVideos = [' in HTML.")

          end_idx = content.find("];", start_idx)
          if end_idx == -1:
              raise SystemExit("Could not find closing '];' after masterVideos in HTML.")

          line_start = content.rfind("\n", 0, start_idx)
          indent = ""
          if line_start != -1:
              prefix = content[line_start + 1:start_idx]
              if prefix.strip() == "":
                  indent = prefix
                  start_idx = line_start + 1

          formatted_items = []
          for i, v in enumerate(videos):
              comma = "," if i < len(videos) - 1 else ""
              formatted_items.append(
                  f"{indent}  {{ src: {json.dumps(v['src'])}, title: {json.dumps(v['title'])} }}{comma}"
              )

          new_block = (
              f"{indent}const masterVideos = [\n"
              + "\n".join(formatted_items)
              + f"\n{indent}];"
          )

          updated = content[:start_idx] + new_block + content[end_idx + 2:]
          with open(html_path, "w", encoding="utf-8") as fh:
              fh.write(updated)

          print(f"Updated {html_path} with {len(videos)} video(s).")
          EOF

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Auto-update masterVideos list and fix videos"
            git push
          fi
